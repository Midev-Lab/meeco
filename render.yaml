# Render blueprint: the front end as a static site (free, never sleeps).
# The API runs on AWS Lambda (see README, "Go live"). The Render web service below is the fallback if you would
# rather host it there: uncomment it, set the same environment variables, and expect a ~1 min wake-up on the free plan.
services:
  - type: web
    name: meeco-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - { key: VITE_API_URL, sync: false }   # the Lambda Function URL printed by deploy_lambda.py

